<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FFFD4" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#00A878" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mintEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FFF0" />
      <stop offset="45%" stop-color="#7FFFD4" />
      <stop offset="100%" stop-color="#00A878" />
    </linearGradient>
  </defs>

  <!-- Fondo escudo oscuro con borde sutil para destacar en pestañas claras y oscuras -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0A0A0A" stroke="#7FFFD4" stroke-opacity="0.35" stroke-width="3" />

  <!-- Resplandor central -->
  <circle cx="64" cy="64" r="52" fill="url(#coreGlow)" />

  <!-- Cristal Hexagonal Exterior del Holocron -->
  <polygon
    points="64,16 106,40 106,88 64,112 22,88 22,40"
    fill="#7FFFD4"
    fill-opacity="0.08"
    stroke="url(#mintEdge)"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Líneas de facetas geométricas del Holocron -->
  <line x1="64" y1="16" x2="64" y2="38" stroke="#7FFFD4" stroke-opacity="0.55" stroke-width="3" />
  <line x1="64" y1="90" x2="64" y2="112" stroke="#7FFFD4" stroke-opacity="0.55" stroke-width="3" />
  <line x1="22" y1="40" x2="42" y2="51" stroke="#7FFFD4" stroke-opacity="0.55" stroke-width="3" />
  <line x1="106" y1="88" x2="86" y2="77" stroke="#7FFFD4" stroke-opacity="0.55" stroke-width="3" />
  <line x1="106" y1="40" x2="86" y2="51" stroke="#7FFFD4" stroke-opacity="0.55" stroke-width="3" />
  <line x1="22" y1="88" x2="42" y2="77" stroke="#7FFFD4" stroke-opacity="0.55" stroke-width="3" />

  <!-- Núcleo Hexagonal Interno -->
  <polygon
    points="64,38 86,51 86,77 64,90 42,77 42,51"
    fill="#7FFFD4"
    fill-opacity="0.22"
    stroke="#7FFFD4"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Cristal Kyber Central Brillante -->
  <circle cx="64" cy="64" r="9" fill="#F8FFF0" />
  <circle cx="64" cy="64" r="14" stroke="#7FFFD4" stroke-opacity="0.6" stroke-width="2" />
</svg>

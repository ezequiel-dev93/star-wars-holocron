<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#03070E"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Tech Grid Lines -->
  <g stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.15">
    <line x1="40" y1="0" x2="40" y2="500"/>
    <line x1="360" y1="0" x2="360" y2="500"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="440" x2="400" y2="440"/>
    <circle cx="200" cy="220" r="140" fill="none" stroke-dasharray="4,6"/>
    <circle cx="200" cy="220" r="90" fill="none" stroke-dasharray="2,4"/>
  </g>

  <!-- Central Holocron Emblem -->
  <g transform="translate(200, 210)" filter="url(#cyanGlow)">
    <!-- Outer Diamond / Holocron -->
    <polygon points="0,-70 60,-20 60,50 0,90 -60,50 -60,-20" fill="none" stroke="#00F0FF" stroke-width="2"/>
    <polygon points="0,-50 45,-15 45,35 0,65 -45,35 -45,-15" fill="#00F0FF" fill-opacity="0.08" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Inner Core -->
    <circle cx="0" cy="10" r="18" fill="#00F0FF" fill-opacity="0.2" stroke="#00F0FF" stroke-width="1.5"/>
    <polygon points="0,-15 15,10 0,35 -15,10" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Corner Brackets -->
  <path d="M 50 70 L 50 50 L 70 50" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 350 70 L 350 50 L 330 50" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 50 430 L 50 450 L 70 450" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 350 430 L 350 450 L 330 450" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Holographic Label -->
  <text x="200" y="370" text-anchor="middle" fill="#00F0FF" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="4" opacity="0.8">
    // HOLOCRON ARCHIVE
  </text>
  <text x="200" y="395" text-anchor="middle" fill="#94A3B8" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" opacity="0.6">
    VISUAL DATA RESTRICTED
  </text>
</svg>
